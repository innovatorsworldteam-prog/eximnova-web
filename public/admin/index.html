<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>EximNova Admin</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172033;background:#f4f6f9}*{box-sizing:border-box}body{margin:0}.shell{min-height:100vh;display:flex}.side{width:245px;background:#14213d;color:#fff;position:fixed;inset:0 auto 0 0;padding:28px 18px;display:flex;flex-direction:column}.brand{font-size:22px;font-weight:850}.brand span{color:#d9a441}.caption{font-size:9px;letter-spacing:.18em;color:#8995aa;margin:28px 10px 12px}.nav{display:grid;gap:4px}.nav button,.logout{border:0;background:transparent;color:#b7c0d0;text-align:left;padding:11px 12px;border-radius:8px;cursor:pointer}.nav button:hover,.nav button.active{background:rgba(255,255,255,.09);color:#fff}.me{margin-top:auto;border-top:1px solid rgba(255,255,255,.1);padding-top:16px;font-size:11px}.logout{width:100%;margin-top:10px}.main{margin-left:245px;width:calc(100% - 245px);padding:0 34px 50px}.top{height:64px;border-bottom:1px solid #e0e4ea;display:flex;justify-content:space-between;align-items:center;font-size:11px;color:#6d7686}.badge{background:#e9f5ed;color:#286244;padding:6px 9px;border-radius:99px;font-weight:800}.hero{margin-top:30px;background:#fff;border:1px solid #e0e4ea;border-radius:14px;padding:28px}.hero h1{margin:0;color:#14213d;font-size:34px}.muted{color:#707a8a}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:16px}.card{background:#fff;border:1px solid #e0e4ea;border-radius:11px;padding:18px}.card small,.card strong{display:block}.card small{color:#788293}.card strong{font-size:27px;color:#14213d;margin-top:7px}.panel{background:#fff;border:1px solid #e0e4ea;border-radius:14px;margin-top:18px;padding:24px}.panel h2{margin:0;color:#14213d}.toolbar{display:flex;gap:8px;justify-content:flex-end;margin:12px 0}.button{border:0;border-radius:8px;padding:9px 13px;cursor:pointer;font-weight:750}.primary{background:#14213d;color:#fff}.secondary{background:#eef1f5;color:#354158}.table{overflow:auto}.row{display:grid;grid-template-columns:2fr 1fr 1fr 1fr 150px;gap:12px;padding:12px 4px;border-bottom:1px solid #e7eaf0;align-items:center;font-size:12px}.head{font-size:10px;color:#7a8493;font-weight:800;text-transform:uppercase}.row select{padding:7px;border:1px solid #d8dde5;border-radius:7px}.danger{color:#a43d35}.error{margin-top:18px;background:#fff0ef;color:#a43d35;border:1px solid #f0c7c3;border-radius:8px;padding:10px}.hidden{display:none}@media(max-width:850px){.side{width:70px;padding:20px 9px}.brand{font-size:0}.brand:before{content:'EN';font-size:16px}.caption,.nav button span,.me{display:none}.nav button{text-align:center;font-size:0}.nav button:after{content:'•';font-size:20px}.main{margin-left:70px;width:calc(100% - 70px);padding:0 16px 40px}.cards{grid-template-columns:repeat(2,1fr)}.row{grid-template-columns:1.5fr 1fr 1fr 100px}}
</style>
</head>
<body>
<div class="shell"><aside class="side"><div class="brand">Exim<span>Nova</span></div><div class="caption">ADMINISTRATION</div><div class="nav"><button data-view="overview" class="active"><span>Overview</span></button><button data-view="users"><span>Users</span></button><button data-view="businesses"><span>Businesses</span></button><button data-view="requirements"><span>Requirements</span></button><button data-view="opportunities"><span>Opportunities</span></button><button data-view="counterparties"><span>Counterparties</span></button><button data-view="dealgate"><span>DealGate</span></button><button data-view="evidence"><span>Evidence</span></button><button data-view="verification"><span>Verification</span></button><button data-view="audit"><span>Audit</span></button></div><div class="me" id="me"></div><button class="logout" id="logout">Sign out</button></aside><main class="main"><header class="top"><span>EximNova Engine v4.1 · Administrative Control Centre</span><span class="badge">ADMIN</span></header><div id="error" class="error hidden"></div><section id="content"></section></main></div>
<script>
const API=localStorage.getItem('eximnova_api')||'https://eximnova-engine-v41.innovatorsworldteam.workers.dev',TOKEN='eximnova_token';
const token=()=>localStorage.getItem(TOKEN);async function api(path,opts={}){const h={'Content-Type':'application/json',...(opts.headers||{})};if(token())h.Authorization='Bearer '+token();const r=await fetch(API+path,{...opts,headers:h}),t=await r.text();let d={};try{d=t?JSON.parse(t):{}}catch{}if(!r.ok)throw Error(d.error||`Request failed (${r.status})`);return d}
const esc=x=>String(x??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\\':'&#92;','"':'&quot;'}[c]));
let me=null,view='overview';
function showError(e){const x=document.getElementById('error');x.textContent=e.message||String(e);x.classList.remove('hidden')}
function clearError(){document.getElementById('error').classList.add('hidden')}
async function init(){clearError();if(!token()){location.href='/';return}try{const d=await api('/api/me');me=d.user;if(!['admin','staff'].includes(me.role))throw Error('Administrative access is not permitted for this account.');document.getElementById('me').textContent=me.email+' · '+me.role;await render()}catch(e){showError(e);setTimeout(()=>location.href='/',1200)}}
async function render(){clearError();const c=document.getElementById('content');if(view==='overview')return overview(c);if(view==='users')return users(c);return collection(c,view)}
async function overview(c){const d=await api('/api/admin/overview');const x=d.data;c.innerHTML='<section class="hero"><h1>Admin control centre</h1><p class="muted">Operational visibility and controlled administration for EximNova.</p></section><div class="cards">'+Object.entries(x).map(([k,v])=>`<div class="card"><small>${esc(k)}</small><strong>${esc(v)}</strong></div>`).join('')+'</div>'}
async function users(c){const d=await api('/api/admin/users');c.innerHTML='<section class="panel"><h2>Users</h2><div class="toolbar"><button class="button secondary" onclick="render()">Refresh</button></div><div class="table"><div class="row head"><div>Email</div><div>Role</div><div>Status</div><div>Verified</div><div>Action</div></div>'+d.data.map(u=>`<div class="row"><div><b>${esc(u.email)}</b><br><small>${esc(u.id)}</small></div><div><select id="role-${esc(u.id)}"><option ${u.role==='user'?'selected':''}>user</option><option ${u.role==='staff'?'selected':''}>staff</option><option ${u.role==='admin'?'selected':''}>admin</option></select></div><div><select id="status-${esc(u.id)}"><option ${u.status==='active'?'selected':''}>active</option><option ${u.status==='suspended'?'selected':''}>suspended</option></select></div><div>${u.email_verified?'Yes':'No'}</div><div><button class="button primary" onclick="saveUser('${esc(u.id)}')">Save</button></div></div>`).join('')+'</div></section>'}
async function saveUser(id){try{clearError();const role=document.getElementById('role-'+id).value,status=document.getElementById('status-'+id).value;await api('/api/admin/users/'+encodeURIComponent(id),{method:'PUT',body:JSON.stringify({role,status})});await users(document.getElementById('content'))}catch(e){showError(e)}}
async function collection(c,key){const d=await api('/api/admin/'+key);const rows=d.data||[];c.innerHTML='<section class="panel"><h2>'+esc(key[0].toUpperCase()+key.slice(1))+'</h2><div class="toolbar"><button class="button secondary" onclick="render()">Refresh</button></div><div class="table"><div class="row head"><div>ID</div><div>Owner</div><div>Status</div><div>Created</div><div></div></div>'+rows.map(x=>`<div class="row"><div><b>${esc(x.id)}</b><br><small>${esc(x.name||x.email||x.product||x.scope||x.original_name||'')}</small></div><div>${esc(x.owner_user_id||'')}</div><div>${esc(x.status||x.role||'')}</div><div>${esc(x.created_at||'')}</div><div></div></div>`).join('')+'</div></section>'}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{view=b.dataset.view;document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');render()});document.getElementById('logout').onclick=()=>{localStorage.removeItem(TOKEN);location.href='/'};init();
</script>
</body></html>
